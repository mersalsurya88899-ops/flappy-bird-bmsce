<!DOCTYPE html>
<html>
<head>
  <title>Flappy Bird BMSCE Final</title>
  <style>
    body { margin:0; overflow:hidden; }
    canvas { display:block; margin:auto; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let frame = 0;
let gameStarted = false;
let shake = 0;

let score = 0;              // pipes only
let coinsCollected = 0;     // coin stat

let gravityDirection = 1;
let gravityTextTimer = 0;
let nextGravityScore = 15;

const bird = {
  x: 80,
  y: 300,
  radius: 15,
  velocity: 0,
  gravity: 0.5,
  lift: -8,
  dashCooldown: 0
};

const pipes = [];
const coins = [];

const logoImg = new Image();
logoImg.src = "https://upload.wikimedia.org/wikipedia/en/7/7c/BMS_College_of_Engineering_Logo.png";

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    gameStarted = true;
    bird.velocity = bird.lift * gravityDirection;
  }

  if (e.code === "ShiftLeft" && bird.dashCooldown <= 0 && gameStarted) {
    bird.x += 80;
    bird.dashCooldown = 100;
  }
});

function isNight() {
  return frame % 1000 > 500;
}

function spawnPipe() {
  const gap = 150;
  const top = Math.random() * 250 + 50;
  const bottom = canvas.height - top - gap;

  pipes.push({ x: canvas.width, top, bottom, passed:false });

  // 🪙 COIN INSIDE PIPE GAP
  coins.push({
    x: canvas.width + 30,
    y: top + gap / 2,
    r: 8,
    collected: false
  });

  // 🪙 RANDOM OPEN SPACE COIN (50% chance)
  if (Math.random() < 0.5) {
    coins.push({
      x: canvas.width + 80,
      y: Math.random() * (canvas.height - 100) + 50,
      r: 8,
      collected: false
    });
  }
}

function drawBird() {
  ctx.beginPath();
  ctx.fillStyle = bird.dashCooldown > 0 ? "red" : "yellow";
  ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipes() {
  pipes.forEach(pipe => {
    ctx.fillStyle = isNight() ? "#8e44ad" : "#2ecc71";

    ctx.fillRect(pipe.x, 0, 60, pipe.top);
    ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 60, pipe.bottom);

    if (logoImg.complete && logoImg.naturalWidth !== 0) {
      ctx.drawImage(logoImg, pipe.x + 10, pipe.top/2 - 20, 40, 40);
      ctx.drawImage(
        logoImg,
        pipe.x + 10,
        canvas.height - pipe.bottom + pipe.bottom/2 - 20,
        40,
        40
      );
    }
  });
}

function drawCoins() {
  coins.forEach(coin => {
    if (!coin.collected) {
      ctx.beginPath();
      ctx.fillStyle = "gold";
      ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function updateBird() {
  if (!gameStarted) return;

  bird.velocity += bird.gravity * gravityDirection;
  bird.y += bird.velocity;

  if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
    crash();
  }

  if (bird.dashCooldown > 0) bird.dashCooldown--;
}

function updatePipes() {
  if (!gameStarted) return;

  pipes.forEach(pipe => pipe.x -= 2);
  coins.forEach(coin => coin.x -= 2);

  pipes.forEach(pipe => {

    // COLLISION
    if (
      bird.x + bird.radius > pipe.x &&
      bird.x - bird.radius < pipe.x + 60 &&
      (bird.y - bird.radius < pipe.top ||
       bird.y + bird.radius > canvas.height - pipe.bottom)
    ) {
      crash();
    }

    // SCORE ONLY FOR PIPES
    if (!pipe.passed && pipe.x + 60 < bird.x) {
      score += 1;
      pipe.passed = true;
      checkGravityShift();
    }
  });

  // COIN COLLECTION
  coins.forEach(coin => {
    const dx = bird.x - coin.x;
    const dy = bird.y - coin.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < bird.radius + coin.r && !coin.collected) {
      coin.collected = true;
      coinsCollected += 1;
    }
  });

  if (pipes.length && pipes[0].x < -60) {
    pipes.shift();
  }

  if (coins.length && coins[0].x < -60) {
    coins.shift();
  }
}

function checkGravityShift() {
  if (score >= nextGravityScore) {
    gravityDirection *= -1;
    gravityTextTimer = 90;
    bird.velocity = 0;
    nextGravityScore += 15;
  }
}

function crash() {
  shake = 15;
  resetGame();
}

function resetGame() {
  bird.y = 300;
  bird.velocity = 0;
  bird.x = 80;
  pipes.length = 0;
  coins.length = 0;
  score = 0;
  coinsCollected = 0;
  gravityDirection = 1;
  gravityTextTimer = 0;
  nextGravityScore = 15;
  gameStarted = false;
}

function drawScore() {
  ctx.fillStyle = isNight() ? "white" : "black";
  ctx.font = "18px Arial";
  ctx.fillText("Score: " + score, 10, 25);
  ctx.fillText("Coins: " + coinsCollected, 10, 45);
}

function drawGravityText() {
  if (gravityTextTimer > 0) {
    ctx.fillStyle = "red";
    ctx.font = "22px Arial";
    ctx.fillText("GRAVITY SHIFT!", 100, 100);
    gravityTextTimer--;
  }
}

function drawStartText() {
  if (!gameStarted) {
    ctx.fillStyle = "black";
    ctx.font = "18px Arial";
    ctx.fillText("Press SPACE to Start", 110, 300);
  }
}

function gameLoop() {
  frame++;

  canvas.style.background = isNight() ? "#001d3d" : "skyblue";

  ctx.save();

  if (shake > 0) {
    ctx.translate(Math.random() * 10 - 5, Math.random() * 10 - 5);
    shake--;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameStarted && frame % 120 === 0) spawnPipe();

  updateBird();
  updatePipes();

  drawBird();
  drawPipes();
  drawCoins();
  drawScore();
  drawGravityText();
  drawStartText();

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
